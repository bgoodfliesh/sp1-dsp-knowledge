CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_I2S=y
CONFIG_ADC=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_WATCHDOG=y
CONFIG_REBOOT=y

{% if midi_support != "None" %}
# MIDI transport selection: {{ midi_support }}
CONFIG_USB_DEVICE_STACK=y
{% else %}
# MIDI transport disabled by template selection.
{% endif %}

# Size & real-time
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_IDLE_STACK_SIZE=512
CONFIG_ISR_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=0
CONFIG_ASSERT=y
CONFIG_SPEED_OPTIMIZATIONS=y

# Logging (keep light)
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2
